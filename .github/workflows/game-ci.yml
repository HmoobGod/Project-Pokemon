name: Game CI (game/)

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/game-ci.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/game-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: game

jobs:
  build-and-test:
    name: Unit tests, typecheck, Vite build, offline check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: No private models / third-party art tracked under game/
        run: |
          set -euo pipefail
          if git ls-files . | grep -iE '\.(glb|gltf|fbx|obj|vrm|png|gif|webp|jpe?g|ogg|mp3|wav)$|(^|/)private-(models|sprites|assets)/'; then
            echo 'Tracked model/image/audio or private asset file found under game/' >&2
            exit 1
          fi
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Tool versions
        run: node -v && npx tsc -v && npx vite --version
      - name: Unit tests
        run: npm test
      - name: Strict TypeScript typecheck
        run: npm run typecheck
      - name: Vite production build
        run: npm run build
      - name: Offline-reference check
        run: npm run check:offline
      - name: Build contains no private sprites (CI is asset-independent)
        run: test ! -e dist/private-sprites && test ! -e public/private-sprites
      - name: Upload Vite build
        uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: game/dist

  browser-smoke:
    name: Headless Chromium smoke (Vite build)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium + system deps
        run: npx playwright install --with-deps chromium
      - name: Vite production build
        run: npm run build
      - name: Smoke test via `vite preview` (the server the owner uses for the phone test)
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > vite-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/private-sprites/sprites.js)
          echo "missing sprites.js -> HTTP $code"; test "$code" = 404
          SMOKE_ORIGIN=http://127.0.0.1:4173 npm run smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-smoke-evidence
          path: game/smoke-output
